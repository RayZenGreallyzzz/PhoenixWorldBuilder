name: Phoenix 3D - preserve full editor and fix APK
on:
  workflow_dispatch:
  push:
    branches: [fix/phoenix3d-full-editor-20261104]
    paths:
      - 'android-phoenix-tools/**'
      - 'android-phoenix-installer/**'
      - 'scripts/phoenix3d/**'
      - '.github/workflows/phoenix3d-build-tools.yml'
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download the user's 6 release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release build original signed
          gh release download 3D --repo RayZenGreallyzzz/PhoenixWorldBuilder --dir release --clobber
          python3 scripts/phoenix3d/reconstruct.py release build/Phoenix3D_Planner.xapk
          python3 - <<'PY'
          import zipfile, pathlib
          with zipfile.ZipFile('build/Phoenix3D_Planner.xapk') as x:
              for name in x.namelist():
                  if '/' in name or not name.endswith('.apk'): raise ValueError(name)
                  pathlib.Path('original',name).write_bytes(x.read(name))
          PY
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDK_MANAGER"
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile additive Android Activity as classes19.dex
        run: |
          mkdir -p build/classes build/dex
          javac -source 8 -target 8 \
            -classpath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d build/classes android-phoenix-tools/src/com/phoenix3d/tools/*.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 29 \
            --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output build/dex $(find build/classes -name '*.class' -print)
          test -s build/dex/classes.dex
      - name: Bundle local Three.js viewer (no CDN/network)
        run: |
          npm install --prefix build/node --no-audit --no-fund --no-package-lock three@0.140.0 jsdom@22.1.0
          mkdir -p build/viewer
          cp android-phoenix-tools/assets/index.html build/viewer/index.html
          cp android-phoenix-tools/assets/game.html build/viewer/game.html
          cp android-phoenix-tools/assets/game-gizmo.js build/viewer/game-gizmo.js
          cp build/node/node_modules/three/build/three.min.js build/viewer/three.min.js
          cp build/node/node_modules/three/examples/js/loaders/GLTFLoader.js build/viewer/GLTFLoader.js
          cp build/node/node_modules/three/examples/js/controls/OrbitControls.js build/viewer/OrbitControls.js
          node --check build/viewer/GLTFLoader.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('build/viewer/game.html').read_text()
          scripts=[html.rsplit('<script>',1)[-1].split('</script>',1)[0]]
          assert len(scripts)==1, 'Expected one offline game controller'
          Path('build/viewer/game-controller.js').write_text(scripts[0])
          PY
          node --check build/viewer/game-controller.js
          node --check build/viewer/game-gizmo.js
          node scripts/phoenix3d/game-smoke.cjs
      - name: Preserve full original editor while adding optional Phoenix tools and display-name changes
        run: |
          python3 scripts/phoenix3d/build_tools_xapk.py \
            --base original/com.planner5d.planner5d.apk \
            --dex build/dex/classes.dex --assets build/viewer \
            --output build/phoenix_patched_unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree \
            build/phoenix_patched_unsigned.apk AndroidManifest.xml | grep PhoenixToolsActivity
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree \
            build/phoenix_patched_unsigned.apk AndroidManifest.xml | grep PhoenixGameActivity
      - name: Verify original building editor, 18 dex files, database and 3D objects preserved
        run: |
          python3 scripts/phoenix3d/verify_full_editor.py original/com.planner5d.planner5d.apk build/phoenix_patched_unsigned.apk
      - name: Sign all 9 APK components with one temporary test key
        run: |
          keytool -genkeypair -keystore build/phoenix-tools-test.jks -storepass phoenix3dtest \
            -keypass phoenix3dtest -alias phoenix3d -keyalg RSA -keysize 3072 \
            -validity 3650 -dname "CN=Phoenix3D Personal Test" -noprompt
          python3 - <<'PY'
          import pathlib,sys
          sys.path.insert(0,'scripts/phoenix3d')
          from build_tools_xapk import strip_v2
          original=pathlib.Path('original')
          for src in original.glob('*.apk'):
              if src.name=='com.planner5d.planner5d.apk':
                  src=pathlib.Path('build/phoenix_patched_unsigned.apk')
              strip_v2(src,pathlib.Path('build/unsigned-'+('com.planner5d.planner5d.apk' if src.name=='phoenix_patched_unsigned.apk' else src.name)))
          PY
          for src in build/unsigned-*.apk; do
            name="${src##*/unsigned-}"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 "$src" "build/aligned-$name"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks build/phoenix-tools-test.jks --ks-key-alias phoenix3d \
              --ks-pass pass:phoenix3dtest --key-pass pass:phoenix3dtest \
              --v1-signing-enabled false --out "signed/$name" "build/aligned-$name"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 29 "signed/$name"
          done
          test "$(find signed -name '*.apk' | wc -l)" -eq 9
      - name: Pack verified experimental XAPK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,json
          target=Path('build/Phoenix3D_Planner_GLB_Tools_TEST.xapk')
          with zipfile.ZipFile(target,'w',compression=zipfile.ZIP_STORED) as z:
              for f in sorted(Path('signed').glob('*.apk')):z.write(f,f.name)
          with zipfile.ZipFile(target) as z:
              assert z.testzip() is None and len(z.namelist())==9
          result={'size':target.stat().st_size,'sha256':hashlib.file_digest(target.open('rb'),'sha256').hexdigest(),
            'status':'TEST ONLY','android_verified':False,
            'features':['same-package third-person playable avatar with touch joystick',
             'separate local wall/floor snapping and game map save (not native Planner project)',
             'read-only approximate Planner JSON wall visualization',
             'in-app additional launcher','local GLB viewer','PNG/JPG texture and stickers',
             'local backup','manual HTTPS WebDAV asset upload'],
            'not_implemented':['inserting GLB into original Planner libGDX room',
             'writing changes from game scene back to original Planner project',
             'backing up native Planner projects',
             'online sign-in removal']}
          Path('build/Phoenix3D_build_report.json').write_text(json.dumps(result,indent=2,ensure_ascii=False))
          print(json.dumps(result,indent=2,ensure_ascii=False))
          PY
      - name: Build an ordinary ONE-FILE Android APK installer (no XAPK app needed)
        run: |
          mkdir -p build/installer-classes build/installer-dex
          javac -source 8 -target 8 \
            -classpath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d build/installer-classes android-phoenix-installer/src/com/phoenix3d/installer/InstallerActivity.java
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 29 \
            --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output build/installer-dex $(find build/installer-classes -name '*.class' -print)
          test -s build/installer-dex/classes.dex
          "$ANDROID_HOME/build-tools/35.0.0/aapt" package -f \
            -M android-phoenix-installer/AndroidManifest.xml \
            -S android-phoenix-installer/res \
            -I "$ANDROID_HOME/platforms/android-35/android.jar" \
            -A signed -0 apk -F build/installer_unsigned.apk
          (cd build/installer-dex && "$ANDROID_HOME/build-tools/35.0.0/aapt" add ../installer_unsigned.apk classes.dex)
          python3 - <<'PY'
          import zipfile,pathlib
          a=pathlib.Path('build/installer_unsigned.apk')
          with zipfile.ZipFile(a) as z:
              names=z.namelist()
              assert 'classes.dex' in names
              expected={'assets/'+f.name for f in pathlib.Path('signed').glob('*.apk')}
              assert len(expected)==9 and expected.issubset(set(names)),(len(expected),names[:20])
              # Runtime reads the *ZIP entry*, not AssetManager.openFd() (broken previously).
              assert all(z.getinfo(entry).file_size>10000 for entry in expected)
              for entry in expected:assert z.getinfo(entry).file_size>10000
          print('ONE APK installer has all 9 signed split APKs embedded; raw bytes:',a.stat().st_size)
          PY
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 \
            build/installer_unsigned.apk build/installer_aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks build/phoenix-tools-test.jks --ks-key-alias phoenix3d \
            --ks-pass pass:phoenix3dtest --key-pass pass:phoenix3dtest \
            --out build/Phoenix3D_One_APK_Installer_TEST.apk build/installer_aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 29 \
            build/Phoenix3D_One_APK_Installer_TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            build/Phoenix3D_One_APK_Installer_TEST.apk | grep "launchable-activity"
          python3 - <<'PY'
          # Test the exact entry path used by ZipFile.getEntry() at runtime.
          import zipfile
          apk='build/Phoenix3D_One_APK_Installer_TEST.apk'
          with zipfile.ZipFile(apk) as z:
              names=z.namelist()
              split=[n for n in names if n.startswith('assets/') and n.endswith('.apk')]
              assert len(split)==9,split
              assert 'assets/com.planner5d.planner5d.apk' in split,split
              assert len(set(split))==9
              assert all(z.getinfo(n).file_size>10000 for n in split)
          print('PASS: ZipFile installer will resolve all nine assets/*.apk entries')
          PY
      - name: Upload personal test APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix3D-FULL-EDITOR-FIX-TEST
          path: |
            build/Phoenix3D_One_APK_Installer_TEST.apk
            build/Phoenix3D_build_report.json
          retention-days: 7
          if-no-files-found: error
