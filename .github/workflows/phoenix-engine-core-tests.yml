name: Phoenix Engine Core checks

on:
  workflow_dispatch:
  push:
    branches:
      - phoenix-engine-0.1
    paths:
      - 'app/src/main/assets/engine/**'
      - 'tests/test-phoenix-core.cjs'
      - 'tests/test-phoenix-events-quests.cjs'
      - 'app/src/main/assets/engine/core/phoenix-events.js'
      - 'app/src/main/assets/engine/core/phoenix-quests.js'
      - 'app/src/main/assets/index.html'
      - 'app/src/main/assets/clean.css'
      - 'app/src/main/assets/js/clean-app.js'
      - 'app/src/main/assets/js/avatar-motion.js'
      - 'tests/test-play-bridge.cjs'
      - 'tests/test-play-wiring.cjs'
      - 'tests/test-prefab-core.cjs'
      - 'tests/test-prefab-editor.cjs'
      - 'tests/test-phoenix-mob-import.cjs'
      - 'tests/test-mob-features.cjs'
      - 'tests/test-phoenix-mob-nametags.cjs'
      - 'app/src/main/assets/engine/core/phoenix-mob-features.js'
      - 'app/src/main/assets/engine/runtime/phoenix-vfx.js'
      - 'tests/test-character-mob-save.cjs'
      - 'tests/test-prefab-wiring.cjs'
      - 'tests/test-manual-project-save.cjs'
      - 'tests/test-phoenix-ai.cjs'
      - 'tests/test-phoenix-animations.cjs'
      - 'tests/test-phoenix-combat.cjs'
      - 'tests/test-player-hud.cjs'
      - 'tests/test-avatar-motion.cjs'
      - 'tests/test-avatar-animation-bindings.cjs'
      - 'tests/test-phoenix-patrol-drawing.cjs'
      - 'app/src/main/assets/engine/core/phoenix-patrol-path.js'
      - 'tests/test-world-layout.cjs'
      - 'tests/test-world-editor.cjs'
      - 'tests/test-terrain-splat.cjs'
      - 'tests/test-placement-ghost.cjs'
      - 'app/src/main/assets/js/placement-ghost.js'
      - 'app/src/main/assets/engine/core/phoenix-terrain-splat.js'
      - 'app/src/main/assets/js/character-collision.js'
      - 'tests/test-visible-engine-ui.cjs'
      - 'tests/test-skill-layout.cjs'
      - 'tests/test-skill-editor.cjs'
      - 'tests/test-skill-images.cjs'
      - 'tests/test-phoenix-weapon.cjs'
      - 'tests/test-phoenix-skills.cjs'
      - 'tests/test-skill-clip-menu.cjs'
      - 'tests/test-phoenix-character-inventory.cjs'
      - 'tests/test-phoenix-gallery-ui.cjs'
      - 'tests/test-phoenix-live-minimap.cjs'
      - 'app/src/main/assets/engine/core/phoenix-inventory.js'
      - 'app/src/main/assets/engine/core/phoenix-minimap.js'
      - 'tests/test-skill-definition-editor.cjs'
      - 'tests/test-play-weapon-skills.cjs'
      - 'tests/test-phoenix-player-combat.cjs'
      - 'tests/test-editor-mode-isolation.cjs'
      - 'server/**'
      - 'app/src/main/assets/engine/core/phoenix-server-export.js'
      - 'app/src/main/assets/engine/builder/phoenix-network-editor.js'
      - 'app/src/main/AndroidManifest.xml'
      - 'tests/test-phoenix-network.cjs'
      - 'tests/test-phoenix-network-foundation.cjs'
      - 'tests/test-phoenix-level-talent-tree.cjs'
      - 'tests/test-play-rpg-wiring.cjs'
      - 'app/src/main/assets/engine/core/phoenix-progression.js'
      - 'app/src/main/assets/engine/core/phoenix-skills.js'
      - 'app/src/main/assets/engine/core/phoenix-network-foundation.js'
      - 'app/src/main/assets/engine/core/phoenix-player-combat.js'
      - '.github/workflows/phoenix-engine-core-tests.yml'

permissions:
  contents: read

jobs:
  core:
    name: Platform-neutral Core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check app/src/main/assets/engine/core/phoenix-core.js
          node --check app/src/main/assets/engine/builder/play-bridge.js
          node --check app/src/main/assets/engine/core/phoenix-prefabs.js
          node --check app/src/main/assets/engine/core/phoenix-ai.js
          node --check app/src/main/assets/engine/core/phoenix-combat.js
          node --check app/src/main/assets/engine/core/phoenix-skill-layout.js
          node --check app/src/main/assets/engine/core/phoenix-events.js
          node --check app/src/main/assets/engine/core/phoenix-quests.js
          node --check app/src/main/assets/engine/core/phoenix-skill-images.js
          node --check app/src/main/assets/engine/core/phoenix-weapon.js
          node --check app/src/main/assets/engine/core/phoenix-skills.js
          node --check app/src/main/assets/engine/core/phoenix-inventory.js
          node --check app/src/main/assets/engine/core/phoenix-minimap.js
          node --check app/src/main/assets/engine/builder/phoenix-character-gallery.js
          node --check app/src/main/assets/engine/builder/phoenix-minimap-editor.js
          node --check app/src/main/assets/engine/builder/skill-definition-editor.js
          node --check app/src/main/assets/engine/builder/skill-hud-editor.js
          node --check app/src/main/assets/engine/runtime/phoenix-animations.js
          node --check app/src/main/assets/engine/builder/prefab-editor.js
          node --check app/src/main/assets/engine/builder/phoenix-network-editor.js
          node --check app/src/main/assets/engine/core/phoenix-network-foundation.js
          node --check app/src/main/assets/engine/core/phoenix-server-export.js
          node --check server/shared/protocol.mjs
          node --check server/shared/world.mjs
          node --check server/shared/room.mjs
          node --check server/node/server.mjs
          node --check server/cloudflare/worker.mjs
          node --check app/src/main/assets/js/avatar-motion.js
          node --check app/src/main/assets/js/placement-ghost.js
          node --check app/src/main/assets/js/clean-app.js
          node --check app/src/main/assets/engine/core/phoenix-mob-features.js
          node --check app/src/main/assets/engine/runtime/phoenix-vfx.js
          node --check app/src/main/assets/engine/core/phoenix-terrain-splat.js
          node --check app/src/main/assets/engine/core/phoenix-world-layout.js
          node --check app/src/main/assets/engine/builder/phoenix-world-editor.js
          node --check app/src/main/assets/js/character-collision.js
      - name: Run Phoenix Core unit tests
        run: |
          node tests/test-phoenix-core.cjs
          node tests/test-phoenix-events-quests.cjs
          node tests/test-play-bridge.cjs
          node tests/test-play-wiring.cjs
          node tests/test-prefab-core.cjs
          node tests/test-prefab-editor.cjs
          node tests/test-phoenix-mob-import.cjs
          node tests/test-mob-features.cjs
          node tests/test-phoenix-mob-nametags.cjs
          node tests/test-character-mob-save.cjs
          node tests/test-prefab-wiring.cjs
          node tests/test-manual-project-save.cjs
          node tests/test-phoenix-ai.cjs
          node tests/test-phoenix-animations.cjs
          node tests/test-phoenix-combat.cjs
          node tests/test-player-hud.cjs
          node tests/test-avatar-motion.cjs
          node tests/test-avatar-animation-bindings.cjs
          node tests/test-phoenix-patrol-drawing.cjs
          node tests/test-world-layout.cjs
          node tests/test-world-editor.cjs
          node tests/test-terrain-splat.cjs
          node tests/test-placement-ghost.cjs
          node tests/test-visible-engine-ui.cjs
          node tests/test-skill-layout.cjs
          node tests/test-skill-editor.cjs
          node tests/test-skill-images.cjs
          node tests/test-phoenix-weapon.cjs
          node tests/test-phoenix-skills.cjs
          node tests/test-phoenix-character-inventory.cjs
          node tests/test-phoenix-gallery-ui.cjs
          node tests/test-phoenix-live-minimap.cjs
          node tests/test-skill-clip-menu.cjs
          node tests/test-skill-definition-editor.cjs
          node tests/test-play-weapon-skills.cjs
          node tests/test-phoenix-player-combat.cjs
          node tests/test-phoenix-level-talent-tree.cjs
          node tests/test-play-rpg-wiring.cjs
          node tests/test-editor-mode-isolation.cjs
          node --test server/tests/room.test.mjs
          node tests/test-phoenix-network.cjs
          node tests/test-phoenix-network-foundation.cjs
