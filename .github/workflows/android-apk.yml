name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source from bootstrap archive
        if: hashFiles('app/src/main/assets/js/app.js') == ''
        run: |
          python3 -m pip install --quiet brotli
          python3 - <<'PY'
          import base64, brotli, hashlib, io, pathlib, tarfile
          compressed=base64.b64decode(pathlib.Path('source_payload.b64').read_text().strip(), validate=True)
          raw=brotli.decompress(compressed)
          expected='9c28360357140ada1eed2bfb9de3881e75b75b965a67bdf957374ab83b36b558'
          assert hashlib.sha256(raw).hexdigest()==expected, 'Source checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as archive:
              for info in archive.getmembers():
                  p=pathlib.PurePosixPath(info.name)
                  if p.is_absolute() or '..' in p.parts:
                      raise ValueError('Invalid archive path')
                  if info.name in ['README.md','.github/workflows/android-apk.yml']:
                      continue
                  archive.extract(info,path='.')
          print('Source extracted and validated')
          PY

      - name: Install pinned Three.js r140 for offline APK
        if: hashFiles('app/src/main/assets/js/three.min.js') == ''
        run: |
          npm install --prefix /tmp/phoenix-three --no-package-lock --no-save three@0.140.0
          cp /tmp/phoenix-three/node_modules/three/build/three.min.js app/src/main/assets/js/three.min.js
          cp /tmp/phoenix-three/node_modules/three/examples/js/controls/OrbitControls.js app/src/main/assets/js/OrbitControls.js
          cp /tmp/phoenix-three/node_modules/three/LICENSE THREEJS_LICENSE.txt

      - name: Validate JavaScript
        run: |
          for file in app/src/main/assets/js/*.js; do node --check "$file"; done
          node tests/test-export.cjs
          node tests/test-zip.cjs
          node tests/test-build-physics.cjs
          node tests/test-avatar.cjs
          node tests/test-game-input.cjs
          node tests/test-camera-scale.cjs
          node tests/test-avatar-fit.cjs
          node tests/test-avatar-root.cjs
          node tests/test-skinned-bounds.cjs
          node tests/test-construction-tools.cjs
          node tests/test-catalog-visual.cjs
          node tests/test-glb-edge-snap.cjs
          node tests/test-roof-ceiling-levels.cjs
          node tests/test-joints-thickness.cjs
          node tests/test-surface-paint.cjs
          node tests/test-save-recovery.cjs

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDK_MANAGER" || { echo "sdkmanager not found"; exit 1; }
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixWorldBuilder-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Make extracted source browsable on GitHub
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore README.md settings.gradle build.gradle app/build.gradle app/src/main tests
          if test -f THREEJS_LICENSE.txt; then git add THREEJS_LICENSE.txt; fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish tested editor source [skip ci]"
            git push origin HEAD:main
          fi
