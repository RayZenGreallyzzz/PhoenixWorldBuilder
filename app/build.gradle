plugins { id 'com.android.application' }
android {
    namespace 'com.phoenix.worldbuilder'
    compileSdk 35
    defaultConfig {
        applicationId 'com.phoenix.worldbuilder'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        debug {
            applicationIdSuffix '.chinesetest'
            versionNameSuffix '-snap-preview'
            manifestPlaceholders = [appLabel: 'Phoenix Snap TEST']
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [appLabel: 'Phoenix Builder']
        }
    }
}
