plugins { id 'com.android.application' }
android {
    namespace 'com.phoenix.worldbuilder'
    compileSdk 35
    defaultConfig {
        applicationId 'com.phoenix.worldbuilder'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '1.7.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        // Stable Phoenix Engine app ID. Never change this suffix again:
        // future updates must increment versionCode and use the SAME signing certificate.
        // Initial v0.6 install is separate from older experimental package IDs.
        debug {
            applicationIdSuffix '.engine.stable'
            versionNameSuffix '-texture-brush-radius'
            manifestPlaceholders = [appLabel: 'Phoenix Engine 1.7']
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [appLabel: 'Phoenix Builder']
        }
    }
}
